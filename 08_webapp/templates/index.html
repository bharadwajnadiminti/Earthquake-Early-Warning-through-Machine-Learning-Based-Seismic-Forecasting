<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Predicting Earthquakes</title>

    <!-- Leaflet: free, no API key (the original used the Google Maps JS API
         with a key hardcoded in this file - removed, see app.py docstring
         for why). Individual per-cell points instead of a blended heatmap
         - each dot is one active grid cell's own predicted probability,
         not a smoothed/interpolated surface. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <!-- Pure color/radius-scale logic lives in its own file so it can be
         unit tested with plain Node (tests/js/risk-scale.test.js) instead
         of only ever being checked by eye - see that file's header comment. -->
    <script src="{{ url_for('static', filename='js/risk-scale.js') }}"></script>

    <style>
      /* Always set the map height explicitly to define the size of the div
       * element that contains the map. */
      #map {
        height: 73%;
        width: 100%;
        background: #aad3df;
      }
      /* Optional: Makes the sample page fill the window. */
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      /* Reference app's Google Maps gave it a permanently-visible "Map |
         Satellite" two-button toggle (white rounded box, top-left) rather
         than an icon you have to open - `collapsed:false` below keeps
         Leaflet's control always expanded, and this restyles its default
         checkbox-list look into that same segmented-button look. */
      .leaflet-control-layers {
        border-radius: 2px;
        box-shadow: 0 1px 4px rgba(0,0,0,.3);
        font-family: Roboto, Arial, sans-serif;
        overflow: hidden;
      }
      /* The actual per-layer <label>s live in .leaflet-control-layers-base,
         nested one level inside .leaflet-control-layers-list (which also
         holds the separator/overlays sections we don't use) - flex has to
         go on -base itself, not -list, to lay "Map"/"Satellite" out as
         side-by-side tabs instead of a stacked list. */
      .leaflet-control-layers-base { display: flex; }
      .leaflet-control-layers-base label {
        margin: 0;
        padding: 8px 16px;
        cursor: pointer;
        font-size: 13px;
        color: #000;
        user-select: none;
      }
      .leaflet-control-layers-base label input { display: none; }
      .leaflet-control-layers-base label.active {
        background: #f0f0f0;
        font-weight: bold;
      }
      .leaflet-control-layers-separator { display: none; }
    </style>
  </head>

  <body>
        <table border=0 cellpadding="1" style="width: 100%; background-color:black;">
            <tr>
              <td><h1><p style="text-align:center"><font color="white">Earthquake Forecaster</font></p></h1></td>
            </tr>
        </table>


    <div id="map"></div>
    <script>

      var earthquakeHorizon = {{ earthquake_horizon | tojson }};
      var map, pointsLayer;

      // colorForProb / radiusForProb now come from static/js/risk-scale.js
      // (loaded above) - continuous color + size scale by predicted
      // probability, not discrete buckets. Day-to-day, most active cells'
      // probabilities move by a few hundredths (e.g. 0.82 -> 0.73), which
      // is a real, model-driven change - discrete color buckets used to
      // swallow moves that didn't cross a bucket edge, making the map look
      // static across the slider even though the numbers underneath were
      // genuinely updating.

      // The slider does a full form POST -> full page reload (this is a
      // plain server-rendered Flask app, not a single-page app), so
      // initMap() runs from scratch on every slider move. Without this,
      // that meant losing which base layer (Map/Satellite) and which
      // part of the world you were looking at every single time. Persist
      // both across reloads in localStorage (per-browser only - not a
      // server-side setting - and wrapped in try/catch since private
      // browsing can block storage access).
      var VIEW_KEY = 'eq_forecaster_view';
      function saveView(patch) {
        try {
          var cur = JSON.parse(localStorage.getItem(VIEW_KEY) || '{}');
          localStorage.setItem(VIEW_KEY, JSON.stringify(Object.assign(cur, patch)));
        } catch (e) { /* private browsing / storage disabled - just skip persistence */ }
      }
      function loadView() {
        try {
          return JSON.parse(localStorage.getItem(VIEW_KEY) || '{}');
        } catch (e) { return {}; }
      }

      function initMap() {
        var saved = loadView();

        // maxBounds + noWrap on every tile layer stop Leaflet's default
        // infinite horizontal wrap - without them, zooming out past
        // "the whole world fits once" repeats the map side-by-side
        // indefinitely as you pan/zoom out.
        // zoomSnap/zoomDelta of 0.25 allow the fractional zoom (1.5) the
        // reference app opened at, instead of Leaflet's default integer-
        // only zoom levels.
        var worldBounds = L.latLngBounds([-90, -180], [90, 180]);
        map = L.map('map', {
          minZoom: 1.5,
          zoomSnap: 0.25,
          zoomDelta: 0.5,
          maxBounds: worldBounds,
          maxBoundsViscosity: 1.0,
        }).setView(saved.center || [0, 0], saved.zoom || 1.5);

        // "Map": Esri World Street Map - labeled countries/places + cream
        // landmass / light-blue ocean, the closest free (no API key) look-
        // alike to the reference app's Google roadmap style. (CartoDB's
        // free basemaps now require a key too - tried, watermarked "API KEY
        // REQUIRED" - Esri's public basemap tiles don't.)
        var roadmap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
          attribution: 'Tiles &copy; Esri',
          maxZoom: 19,
          noWrap: true,
          bounds: worldBounds,
        });

        // "Satellite": Esri World Imagery - free, no key, matches the
        // reference app's Map/Satellite toggle.
        var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
          attribution: 'Tiles &copy; Esri',
          maxZoom: 19,
          noWrap: true,
          bounds: worldBounds,
        });

        // Restore whichever base layer was active before the last slider
        // move (defaults to "Map" the very first time).
        (saved.baseLayer === 'Satellite' ? satellite : roadmap).addTo(map);

        // collapsed:false keeps it permanently open as a "Map | Satellite"
        // toggle (see CSS above), matching the reference app's always-
        // visible Google Maps control, instead of Leaflet's default
        // icon-that-expands-on-hover.
        var baseLayers = { 'Map': roadmap, 'Satellite': satellite };
        var layersControl = L.control.layers(baseLayers, null, { position: 'topleft', collapsed: false }).addTo(map);

        function markActiveBaseLayer(name) {
          var labels = layersControl.getContainer().querySelectorAll('.leaflet-control-layers-base label');
          labels.forEach(function (label) {
            var isThis = label.textContent.trim() === name;
            label.classList.toggle('active', isThis);
          });
        }
        markActiveBaseLayer(saved.baseLayer === 'Satellite' ? 'Satellite' : 'Map');

        map.on('baselayerchange', function (e) {
          saveView({ baseLayer: e.name });
          markActiveBaseLayer(e.name);
        });
        map.on('moveend', function () {
          saveView({ center: map.getCenter(), zoom: map.getZoom() });
        });

        // One circle marker per active grid cell's own forecast - not a
        // blended/interpolated heatmap surface, so what you see is exactly
        // what the model predicted for that cell, nothing smoothed in
        // between.
        pointsLayer = L.layerGroup();
        getPoints().forEach(function (pt) {
          var lat = pt[0], lon = pt[1], p = pt[2];
          L.circleMarker([lat, lon], {
            radius: radiusForProb(p),
            weight: 1,
            color: '#222',
            fillColor: colorForProb(p),
            fillOpacity: 0.85,
          })
            .bindPopup('P(M4.5+ in next 7 days) = ' + p.toFixed(2))
            .bindTooltip(p.toFixed(2), { permanent: false, direction: 'top' })
            .addTo(pointsLayer);
        });
        pointsLayer.addTo(map);
      }

      // Point data: [lat, lon, weight] triples, weight = predicted probability
      function getPoints() {
        return earthquakeHorizon;
      }

      initMap();
    </script>

        <table border=1 cellpadding="1" style="width:100%; background-color:black;">
            <tr>
                <td><p style="text-align:center">
                  <form id='submit_params' method="POST" action="{{ url_for('build_page') }}">
                    <div class="slidecontainer" style='width: 100%;'>
                    <label><font color="white">Select future date: <span id="label_slider_value">{{date_horizon}}</span></font></label><BR>
                    <input type="range" min="0" max="{{days_out_to_predict}}" value="{{current_value}}" name="slider_date_horizon"
                      id="slider_date_horizon" step="1" style='width: 100%;'>
                  </div>
                </form>
             </td>
          </tr>
      </table>


     <script>
        // Slider logic
        var slider1 = document.getElementById("slider_date_horizon");
        var output1 = document.getElementById("label_slider_value");

          slider1.onmouseup = function () {
            document.getElementById("submit_params").submit();
          }

        slider1.oninput = function() {
            var horizon_date = new Date();
            horizon_date.setDate(horizon_date.getDate() + Math.trunc(parseInt(this.value)));
            output1.innerHTML = (horizon_date.getMonth()+1) + "/" + horizon_date.getDate() + "/" + horizon_date.getFullYear(); //this.value;

        }

     </script>
    </body>
</html>
